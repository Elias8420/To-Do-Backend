name: Merge feature branch to develop
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  merge-to-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with maven
        working-directory: To-Do-List
        run: mvn clean install -DskipTests

      - name: Run tests
        working-directory: To-Do-List
        run: mvn test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: To-Do-List-Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/to-do-backend:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/to-do-backend:latest
